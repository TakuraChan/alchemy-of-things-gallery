<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Write to Takura Changwa.">
    <title>Contact — Alchemy of Things</title>
    <link rel="icon" type="image/svg+xml" href="/images/symbol.svg">
    <link rel="apple-touch-icon" href="/images/icon-180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Alchemy">
    <meta name="theme-color" content="#faf9f7">
    <meta property="og:title" content="Contact — Alchemy of Things">
    <meta property="og:description" content="Write to Takura Changwa.">
    <meta property="og:image" content="/images/symbol.svg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="main">
        <section class="inquiry">
            <p class="ascent"><a class="ascent-up" href="/">Contact</a></p>
            <!-- Netlify captures this server side the moment it arrives, with its
                 own timestamp, whether or not the notification email is delivered.
                 The hidden form-name is what identifies it when posted by script. -->
            <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="form">
                <input type="hidden" name="form-name" value="contact">
                <p hidden><input name="bot-field"></p>
                <div class="field"><label for="c-reason">Regarding</label>
                    <select id="c-reason" name="reason">
                        <option value=""></option>
                        <option value="Inquiry">Inquiry</option>
                        <option value="Painting inquiry">Painting inquiry</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="field"><label for="c-name">Name</label><input type="text" id="c-name" name="name" required></div>
                <div class="field"><label for="c-email">Email</label><input type="email" id="c-email" name="email" required></div>
                <div class="field"><label for="c-message">Message</label><textarea id="c-message" name="message" required></textarea></div>
                <button type="submit">send</button>
            </form>
            <p class="contact-alt">or write directly to
                <a href="mailto:inquire@alchemyofthings.com">inquire@alchemyofthings.com</a></p>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <img src="/images/symbol.svg" alt="" class="symbol-footer">
            <p class="footer-text">alchemy of things</p>
        </div>
    </footer>
    <script src="/js/nav.js"></script>
    <script>
        document.getElementById('form').onsubmit=async function(e){
            e.preventDefault();
            const b=this.querySelector('button');
            b.textContent='sending...';b.disabled=true;
            try{
                const r=await fetch('/',{method:'POST',
                    headers:{'Content-Type':'application/x-www-form-urlencoded'},
                    body:new URLSearchParams(new FormData(this))});
                if(!r.ok)throw new Error(r.status);
                // Say plainly that it arrived, and where it went.
                document.querySelector('.inquiry').innerHTML=
                    '<p class="ascent"><a class="ascent-up" href="/">Contact</a></p>'
                    +'<p class="success">Thank you. Your message has been received.'
                    +'<br>A response will follow.</p>';
            }catch(err){
                // Never swallow it: the message is still in the field, and the
                // address is right there.
                b.textContent='send';b.disabled=false;
                const note=document.getElementById('send-failed')||document.createElement('p');
                note.id='send-failed';note.className='contact-alt';
                note.innerHTML='That did not send. Please try again, or write to '
                    +'<a href="mailto:inquire@alchemyofthings.com">inquire@alchemyofthings.com</a>.';
                this.appendChild(note);
            }
        };
    </script>
</body>
</html>
