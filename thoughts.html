<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Thought experiments by Takura Changwa.">
    <title>Thoughts — Alchemy of Things</title>
    <link rel="icon" type="image/svg+xml" href="/images/symbol.svg">
    <link rel="apple-touch-icon" href="/images/icon-180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Alchemy">
    <meta name="theme-color" content="#faf9f7">
    <meta property="og:title" content="Thoughts — Alchemy of Things">
    <meta property="og:description" content="Thought experiments by Takura Changwa.">
    <meta property="og:image" content="/images/symbol.svg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="reading bare">
    <main class="main">
        <section class="thoughts-list">
            <p class="ascent"><a class="ascent-up" href="/" id="thoughts-name">Thoughts</a></p>
            <div id="thought-entries"></div>
        </section>
    </main>
    <script src="/js/nav.js"></script>
    <script src="/js/thoughts.js"></script>
    <script>
        (async()=>{
            const c=document.getElementById('thought-entries');
            const [entries,meta]=await Promise.all([loadThoughts(),thoughtsMeta()]);
            document.getElementById('thoughts-name').textContent=meta.name;
            document.title=meta.name+' — Alchemy of Things';
            if(!entries.length){c.innerHTML='<p class="thought-empty">new thinking coming soon</p>';return}
            c.innerHTML=entries.map((e,i)=>`
                <a class="thought-entry" href="${thoughtHref(e)}">
                    ${meta.showEntryLabel?`<span class="thought-number">${escapeText(meta.entryLabel)} ${i+1}</span>`:''}
                    <span class="thought-title">${escapeText(e.title||'Untitled')}</span>
                </a>`).join('');
        })();
    </script>
</body>
</html>
