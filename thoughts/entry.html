<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="A thought experiment by Takura Changwa.">
    <title>Thoughts — Alchemy of Things</title>
    <link rel="icon" type="image/svg+xml" href="/images/symbol.svg">
    <link rel="apple-touch-icon" href="/images/icon-180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Alchemy">
    <meta name="theme-color" content="#faf9f7">
    <meta property="og:title" content="Thoughts — Alchemy of Things">
    <meta property="og:description" content="A thought experiment by Takura Changwa.">
    <meta property="og:image" content="/images/symbol.svg">
    <meta property="og:type" content="article">
    <meta name="twitter:card" content="summary">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="reading">
    <nav class="nav">
        <div class="nav-links"></div>
    </nav>
    <main class="main">
        <article class="thoughts" id="entry"></article>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <img src="/images/symbol.svg" alt="" class="symbol-footer">
            <p class="footer-text">alchemy of things</p>
        </div>
    </footer>
    <script src="/js/nav.js"></script>
    <script src="/js/thoughts.js"></script>
    <script>
        (async()=>{
            const c=document.getElementById('entry');
            const id=new URLSearchParams(location.search).get('id');
            const entries=await loadThoughts();
            const i=entries.findIndex(e=>e.id===id);
            if(i<0){
                c.innerHTML='<p class="thoughts-segment"><a href="/thoughts.html">Thoughts</a></p>'
                    +'<p class="thought-empty">This thought is not here.</p>';
                return;
            }
            const e=entries[i];
            document.title=e.title+' — Alchemy of Things';
            c.innerHTML='<p class="thoughts-segment"><a href="/thoughts.html">Thought experiment '+(i+1)+'</a></p>'
                +'<h1 class="thoughts-title">'+escapeText(e.title||'Untitled')+'</h1>'
                +(e.image?'<img class="thought-image" src="'+escapeText(e.image)+'" alt="">':'')
                +'<section>'+thoughtBody(e.text)+'</section>';
        })();
    </script>
</body>
</html>
