<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Short stillnesses, taken in passing.">
    <title>Moments — Alchemy of Things</title>
    <link rel="icon" type="image/svg+xml" href="/images/symbol.svg">
    <link rel="apple-touch-icon" href="/images/icon-180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Alchemy">
    <meta name="theme-color" content="#faf9f7">
    <meta property="og:title" content="Moments — Alchemy of Things">
    <meta property="og:description" content="Short stillnesses, taken in passing.">
    <meta property="og:image" content="/images/symbol.svg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="reading bare">
    <main class="main">
        <section class="thoughts-list">
            <p class="ascent"><a class="ascent-up" href="/">Moments</a></p>
            <div id="moment-entries"></div>
        </section>
    </main>
    <script src="/js/nav.js"></script>
    <script src="/js/moments.js"></script>
    <script>
        (async()=>{
            const c=document.getElementById('moment-entries');
            const moments=await loadMoments();
            if(!moments.length){c.innerHTML='<p class="thought-empty">new stillness coming soon</p>';return}
            c.innerHTML=moments.map(m=>`
                <a class="thought-entry" href="${momentHref(m)}">
                    <span class="thought-title">${momentEscape(m.title||'Untitled')}</span>
                </a>`).join('');
        })();
    </script>
</body>
</html>
